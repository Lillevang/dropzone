# https://taskfile.dev

version: '3'

vars:
  IMAGE: ghcr.io/lillevang/dropzone
  TAG_FILE: .version
  TAG:
    sh: cat .version
  RUNTIME:
    sh: command -v podman >/dev/null 2>&1 && echo podman || echo docker
  # Private key + password live only in 1Password — never on disk, never in CI.
  OP_ITEM: '{{.OP_ITEM | default "op://Personal/cosign"}}'

# cosign and trivy (go-containerregistry) read $DOCKER_CONFIG/config.json, but
# podman keeps its ghcr.io credentials in its own authfile. Point those tools at
# podman's authfile so a single `podman login ghcr.io` is all you need; there is
# no separate `docker login` / ~/.docker/config.json to keep in sync. Falls back
# to the default docker config when podman is not the runtime.
env:
  DOCKER_CONFIG:
    sh: |
      if command -v podman >/dev/null 2>&1; then
        for f in "${REGISTRY_AUTH_FILE:-}" "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/containers/auth.json" "$HOME/.config/containers/auth.json"; do
          if [ -n "$f" ] && [ -f "$f" ]; then
            d="${TMPDIR:-/tmp}/dropzone-ghcr-authcfg"
            mkdir -p "$d" && ln -sf "$f" "$d/config.json"
            echo "$d"; exit 0
          fi
        done
      fi
      echo "${DOCKER_CONFIG:-$HOME/.docker}"

tasks:
  bump:
    desc: Bump version (patch, minor, major)
    vars:
      TARGET: '{{.TARGET | default "patch"}}'
    cmds:
      - |
        CURRENT=$(cat {{.TAG_FILE}})
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "{{.TARGET}}" in
         patch) PATCH=$((PATCH+1));;
         minor) MINOR=$((MINOR+1)); PATCH=0;;
         major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
         *) echo "Unknown bump target: {{.TARGET}}" && exit 1;;
        esac
        NEW="$MAJOR.$MINOR.$PATCH"
        echo "$NEW" > {{.TAG_FILE}}
        echo "🔼 Bumped version: $CURRENT → $NEW"

  build:
    desc: Build the dropzone container image
    cmds:
      - "{{.RUNTIME}} build -t {{.IMAGE}}:{{.TAG}} ."

  healthcheck:
    desc: Run local container and check /healthz endpoint
    cmds:
      - |
        echo "🚀 Starting container {{.IMAGE}}:{{.TAG}}"
        NETWORK_OPT=$([ "{{.RUNTIME}}" = "podman" ] && echo "--network=slirp4netns" || echo "")
        # /healthz needs no token and is exempt from the Host allowlist, but the
        # app still wants DROPZONE_TOKEN set for a realistic boot.
        CID=$({{.RUNTIME}} run -d $NETWORK_OPT -p 8081:8080 \
          -e DROPZONE_TOKEN=healthcheck-only \
          {{.IMAGE}}:{{.TAG}})
        echo "⌛ Waiting for /healthz"
        sleep 5
        # Unlike the other apps, dropzone's /healthz returns JSON ({"ok":true}),
        # not the literal string "ok" — so this checks for a 200, not a body.
        if curl --max-time 5 -fs http://localhost:8081/healthz >/dev/null; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed"
          {{.RUNTIME}} logs "$CID"
          {{.RUNTIME}} stop "$CID" && {{.RUNTIME}} rm "$CID"
          exit 1
        fi
        {{.RUNTIME}} stop "$CID" && {{.RUNTIME}} rm "$CID"

  verify:
    desc: Build and verify health
    cmds:
      - task: build
      - task: healthcheck

  push:
    desc: Push the image to GHCR
    cmds:
      - |
        echo "📦 Pushing image {{.IMAGE}}:{{.TAG}}"
        {{.RUNTIME}} push {{.IMAGE}}:{{.TAG}}

  resolve-digest:
    internal: true
    cmds:
      - |
        set -euo pipefail
        # Resolve the digest from the REGISTRY (not the local image store): that
        # is what the cluster pulls and what Kyverno verifies. skopeo shares
        # podman's credential store (containers/auth.json), unlike crane which
        # reads ~/.docker/config.json. Validated so a registry blip can't
        # truncate .digest and send cosign at "{{.IMAGE}}@".
        DIGEST=$(skopeo inspect --no-tags docker://{{.IMAGE}}:{{.TAG}} | jq -er .Digest)
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "❌ unexpected digest for {{.IMAGE}}:{{.TAG}}: '$DIGEST'"; exit 1;;
        esac
        echo "$DIGEST" > .digest

  sign:
    desc: Sign the pushed image digest with cosign (key injected from 1Password, never on disk)
    cmds:
      - task: resolve-digest
      - |
        set -euo pipefail
        DIGEST=$(cat .digest)
        echo "🔏 Signing image {{.IMAGE}}@$DIGEST"
        # Registry auth comes from the DOCKER_CONFIG env block above.
        # The three flags are LOAD-BEARING (infra docs/kyverno.md, Phase 3):
        # cosign v3 defaults to the sigstore bundle format (OCI referrers),
        # which Kyverno 1.18 cannot verify key-based. These produce the legacy
        # sha256-<digest>.sig signature its Cosign attestor reads, and keep the
        # release out of the public Rekor log (policy sets rekor.ignoreTlog).
        # Deprecated upstream — revisit at the next Kyverno upgrade.
        # Assign on their own lines, NOT as a `VAR=$(op read ...) cosign ...`
        # prefix: errexit ignores a failed substitution in an assignment
        # prefix, so a dead 1Password session hands cosign an EMPTY key and
        # fails with a misleading "invalid pem block" (url-shortener PR #13).
        COSIGN_PRIVATE_KEY=$(op read "{{.OP_ITEM}}/private-key")
        COSIGN_PASSWORD=$(op read "{{.OP_ITEM}}/password")
        export COSIGN_PRIVATE_KEY COSIGN_PASSWORD
        cosign sign --yes \
          --new-bundle-format=false --use-signing-config=false --tlog-upload=false \
          --key env://COSIGN_PRIVATE_KEY \
          {{.IMAGE}}@$DIGEST

  verify-signature:
    desc: Verify the pushed image's signature offline, exactly as the cluster does
    cmds:
      - task: resolve-digest
      - |
        set -euo pipefail
        DIGEST=$(cat .digest)
        # Bare assignment, not a prefix — see the note in `sign`.
        COSIGN_PUBLIC_KEY=$(op read "{{.OP_ITEM}}/public-key")
        export COSIGN_PUBLIC_KEY
        cosign verify --key env://COSIGN_PUBLIC_KEY \
          --insecure-ignore-tlog=true \
          {{.IMAGE}}@$DIGEST > /dev/null
        echo "✅ Signature verified for {{.IMAGE}}@$DIGEST"

  trivy:
    desc: Generate SBOM and vulnerability report with Trivy
    cmds:
      - mkdir -p ./security
      - echo "🔍 Generating SBOM with Trivy"
      - trivy image --format cyclonedx --output ./security/sbom-{{.TAG}}.json {{.IMAGE}}:{{.TAG}}
      - echo "🛡 Generating vulnerability scan report"
      - trivy image --format json --scanners vuln --output ./security/vulns-{{.TAG}}.json {{.IMAGE}}:{{.TAG}}

  commit-artifacts:
    desc: Commit .version, digest, SBOM and vuln reports to Git
    cmds:
      - |
        echo "📦 Committing version + security artifacts"
        git add .version .digest security/sbom-{{.TAG}}.json security/vulns-{{.TAG}}.json
        git commit -m "chore: release {{.TAG}}"
        git push

  release:
    desc: Full release pipeline (build, push, sign, verify, scan, commit)
    cmds:
      - task: verify
      - task: push
      - task: sign
      - task: verify-signature
      - task: trivy
      - task: commit-artifacts
      - echo ""
      - echo "✅ Released and signed {{.IMAGE}}:{{.TAG}}"
      - echo "   Bump the image tag in the infra repo (apps/dropzone/deploy.yaml) to deploy via ArgoCD."
